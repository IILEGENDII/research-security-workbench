name: Workbench checks
on: [push, pull_request]
permissions:
  contents: read
env:
  PIP_NO_CACHE_DIR: '1'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.15'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q -rs
      - run: python tools/robustness.py --seed 61 --count 120
      - run: python -m build
      - run: python tools/verify_distribution.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - name: Install reviewed upstream commits
        run: |
          python tools/install_references.py "$RUNNER_TEMP/references"
          echo "WORKBENCH_REFERENCES=$RUNNER_TEMP/references" >> "$GITHUB_ENV"
      - name: Verify synthetic backup engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/restic/restic/releases/download/v0.20.0
          archive=restic_0.20.0_linux_amd64.bz2
          curl -fsSL --retry 3 "$base/SHA256SUMS" -o SHA256SUMS
          echo "57850f4ec5257e288388f708c9866eea83f9d8a91f103f48408be63af1a709f3  SHA256SUMS" | sha256sum --check
          curl -fsSL --retry 3 "$base/$archive" -o "$archive"
          echo "0ccd9fa7885074a24603b051e01bf9bd8b5e45d6a1791e9d9887e9e9372107f7  $archive" | sha256sum --check
          bzip2 -dc "$archive" > restic
          chmod 0700 restic
          echo "WORKBENCH_RESTIC=$RUNNER_TEMP/restic" >> "$GITHUB_ENV"
      - name: Run collectors, bundled-parser tests, full audit and restore planning
        env:
          WORKBENCH_INTEGRATION: '1'
        run: python -m pytest -q -rs
