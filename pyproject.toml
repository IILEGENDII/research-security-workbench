[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-security-workbench"
version = "0.1.0"
description = "Evaluate local scientific workstation evidence against explicit policy"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
research-security = "research_workbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_workbench = ["fixtures/*.json", "fixtures/*.txt", "tool_hashes.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
